[project]
name = "citizentech-api"
version = "0.1.0"
description = "API FastAPI do CitizenTech (FIAP GS 2026.2)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "oracledb>=26.1.0",
    "portalocker>=4.4.2",
    "pyjwt>=2.15.1",
    "pymongo>=4.20.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "citizentech"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "oracle: testes que dependem do banco de dados Oracle",
    "mongo: testes que dependem do banco de dados MongoDB",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
