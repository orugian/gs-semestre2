exercicio:
  id: "ex_analista_dados_bi_01"
  versao: "0.1.0"
  tipo: "diagnostico_pratico_didatico"
  requisitos_nao_avaliados: []
  cenario: "Cenário didático e sintético: A rede de clínicas 'Saúde & Vida' consolidou dados de atendimentos ambulatoriais e agendamentos em um banco de dados relacional. O analista precisa identificar inconsistências na ingestão dos registros diários, consultar tabelas relacionais em SQL, gerar visualizações para a diretoria operacional e estruturar um pipeline de ETL para integrar prontuários legados."

  questoes_objetivas:
    - id: "q1"
      enunciado: "Em um banco de dados analítico, a tabela 'atendimentos' possui os campos: id_atendimento, id_unidade, especialidade, valor_consulta e data_atendimento. Para calcular o faturamento total e o tíquete médio por especialidade nas consultas realizadas em 2026, qual consulta SQL expressa corretamente essa agregação?"
      alternativas:
        A: "SELECT especialidade, SUM(valor_consulta) AS faturamento, AVG(valor_consulta) AS media FROM atendimentos WHERE data_atendimento >= '2026-01-01' AND data_atendimento <= '2026-12-31' GROUP BY especialidade;"
        B: "SELECT especialidade, COUNT(valor_consulta) AS faturamento, AVG(valor_consulta) AS media FROM atendimentos GROUP BY especialidade HAVING data_atendimento >= '2026-01-01' AND data_atendimento <= '2026-12-31';"
        C: "SELECT especialidade, SUM(valor_consulta) OVER (PARTITION BY especialidade) AS faturamento, AVG(valor_consulta) OVER (PARTITION BY especialidade) AS media FROM atendimentos WHERE ano = 2026;"
        D: "SELECT especialidade, SUM(valor_consulta) AS faturamento, AVG(valor_consulta) AS media FROM atendimentos WHERE data_atendimento BETWEEN '2026-01-01' AND '2026-12-31' ORDER BY especialidade;"
      gabarito: "A"
      justificativa: "A consulta correta aplica as funções de agregação SUM e AVG com agrupamento dimensional pela cláusula GROUP BY e filtra o período anual na cláusula WHERE. Filtrar colunas não agregadas no HAVING gera erro de sintaxe, funções de janela com PARTITION BY preservam granularidade de linha sem colapsar os grupos, e ORDER BY apenas ordena os registros sem realizar agregação."
      requisitos_avaliados:
        - "sql"
        - "analisar_dados"

    - id: "q2"
      enunciado: "Durante a validação de um lote diário de 50.000 novos registros de agendamento recebidos via arquivo CSV, o analista nota que 4% dos registros possuem o campo 'id_paciente' preenchido como NULL, violando a integridade referencial com a tabela de cadastro. Qual conduta é recomendada na etapa de garantia de qualidade (QA) do ETL?"
      alternativas:
        A: "Descartar silenciosamente as linhas inválidas no pipeline de ingestão e prosseguir com a carga dos registros restantes sem gerar notificações operacionais."
        B: "Direcionar os registros inconsistentes para uma tabela de quarentena, emitir alerta de inconsistência à origem e carregar apenas os registros válidos no data warehouse."
        C: "Substituir os valores nulos por um identificador padrão temporário como zero para permitir a conclusão da carga relacional sem quebrar chaves estrangeiras."
        D: "Interromper imediatamente todo o processo de processamento da base analítica e abortar a carga de todos os 50.000 registros até a correção manual na origem."
      gabarito: "B"
      justificativa: "O isolamento em quarentena preserva a integridade referencial e o SLA operacional da base confiável enquanto notifica a origem para saneamento. Descartar silenciosamente oculta perdas de dados, imputar chaves artificiais falseia métricas assistenciais e abortar todo o lote interrompe desnecessariamente a operação de registros válidos."
      requisitos_avaliados:
        - "garantia_qualidade_dados"
        - "ferramentas_etl"

    - id: "q3"
      enunciado: "A diretoria médica solicitou um relatório para entender a evolução mensal do total de cirurgias ambulatoriais ao longo dos últimos 3 anos, comparando a sazonalidade entre os meses. Qual representação visual é mais indicada para evidenciar tendências temporais contínuas e padrões sazonais?"
      alternativas:
        A: "Gráfico de setores circulares particionado em 36 fatias proporcionais para representar cada mês individual do triênio analisado."
        B: "Gráfico de barras empilhadas normalizadas em 100% comparando a proporção de cada unidade hospitalar sem destacar a continuidade temporal."
        C: "Gráfico de linhas temporais com meses no eixo horizontal e volume no vertical, permitindo sobreposição de séries anuais para verificar sazonalidade."
        D: "Gráfico de dispersão pontual relacionando o identificador numérico da cirurgia com o dia da semana sem conexões sequenciais entre os períodos."
      gabarito: "C"
      justificativa: "Gráficos de linhas com séries sobrepostas são o padrão analítico para evidenciar continuidade temporal, tendências históricas e ciclos de sazonalidade. Gráficos de setores com dezenas de fatias inviabilizam a leitura comparativa, barras normalizadas ocultam o volume absoluto e dispersões sem linha não comunicam a passagem do tempo."
      requisitos_avaliados:
        - "realizar_apresentacao_visual_dados"
        - "identificar_padroes_estatisticos"

    - id: "q4"
      enunciado: "Ao entrevistar a gerência de atendimento para criar um novo painel de gestão, os coordenadores relatam: 'Precisamos saber rapidamente onde os pacientes esperam mais do que 30 minutos entre a triagem e o primeiro atendimento médico'. Qual métrica primária e qual nível de agregação respondem diretamente a esse requisito de negócio?"
      alternativas:
        A: "Tempo médio global de espera calculado sobre todos os atendimentos do hospital sem segmentação de turnos ou unidades físicas."
        B: "Contagem total de cancelamentos de fichas de atendimento no balcão de recepção antes da realização da triagem inicial de enfermagem."
        C: "Duração média da consulta médica individualizada dividida pela quantidade de consultórios disponíveis em cada setor ambulatorial."
        D: "Percentual de atendimentos com tempo de espera superior a 30 minutos na triagem, discriminado por unidade de atendimento e turno operacional."
      gabarito: "D"
      justificativa: "A taxa de conformidade percentual sobre o limiar de 30 minutos segmentada por unidade e turno traduz fielmente a regra de negócio e orienta intervenções operacionais localizadas. Médias globais mascaram filas extremas através de diluição matemática, cancelamentos medem evasão prévia e duração de consulta avalia tempo de atendimento clínico em vez de fila de espera."
      requisitos_avaliados:
        - "identificar_requisitos_clientes"
        - "gerir_sistemas_recolha_dados"

  questao_aberta:
    id: "qa1"
    enunciado: "A rede de clínicas deseja automatizar a ingestão diária de exames laboratoriais de 12 laboratórios parceiros em formatos heterogêneos (CSV, JSON e APIs REST). Os gestores reclamam que alguns laudos chegam duplicados e que relatórios semanais divergem dependendo do horário em que foram emitidos. Descreva uma proposta técnica sintética contendo: (1) como você estruturaria o pipeline de ETL/ELT para padronizar e desduplicar os registros; (2) quais verificações de garantia de qualidade dos dados seriam inseridas antes da liberação para os dashboards; e (3) qual métrica de integridade você apresentaria aos gestores para comprovar a confiabilidade dos relatórios."
    requisitos_avaliados:
      - "analisar_dados"
      - "garantia_qualidade_dados"
      - "ferramentas_etl"
      - "identificar_requisitos_clientes"
    rubrica:
      - id: "crit_arquitetura_etl"
        descricao: "Avalia a coerência da arquitetura de ingestão proposta (camadas raw/stage/trusted) e a estratégia de desduplicação."
        requisitos_avaliados:
          - "ferramentas_etl"
          - "analisar_dados"
        ancoras:
          0: "Não propõe arquitetura de camadas ou sugere sobrescrita direta em produção sem tratamento de duplicidades."
          1: "Descreve etapas de ingestão e limpeza, mas a estratégia de desduplicação ou padronização de formatos é vaga ou incompleta."
          2: "Apresenta estrutura em camadas com área de pouso (staging/raw), chave canônica única para desduplicação e rotina clara de carga incremental."

      - id: "crit_qualidade_e_validacao"
        descricao: "Avalia o rigor técnico na definição de validações de integridade, completude e consistência temporal dos dados."
        requisitos_avaliados:
          - "garantia_qualidade_dados"
        ancoras:
          0: "Não cita rotinas de validação de qualidade dos dados ou ignora a inconsistência de horários de corte."
          1: "Cita validações genéricas de formato sem definir regras para dados nulos, chaves órfãs ou controle de lote/horário de corte."
          2: "Especifica regras automáticas de validação (completude, unicidade, consistência de datas e janelas de corte diário bem definidas)."

      - id: "crit_alinhamento_negocio"
        descricao: "Avalia a pertinência da métrica de integridade comunicada e o alinhamento com a necessidade de confiabilidade dos gestores."
        requisitos_avaliados:
          - "identificar_requisitos_clientes"
        ancoras:
          0: "Não apresenta métrica de confiabilidade ou propõe indicador sem relação com a qualidade do pipeline."
          1: "Apresenta métrica operacional com explicação parcial sobre como comprovar a estabilidade dos dados aos gestores."
          2: "Define indicador claro e acionável de integridade (ex: percentual de registros conformes por lote, taxa de descarte em quarentena ou SLA de sincronismo)."

