exercicio:
  id: "ex_desenvolvedor_sistemas_01"
  versao: "0.1.0"
  tipo: "diagnostico_pratico_didatico"
  requisitos_nao_avaliados:
    - "elaborar_documentacao_tecnica"
    - "gestao_agil_projetos"
  cenario: "Cenário didático e sintético: A plataforma de e-commerce 'ShopTech' implementou um serviço de processamento de pagamentos em Python/FastAPI integrado a um banco de dados relacional. Em dias de grande promoção, o sistema apresentou pedidos com status inconsistente (pedidos marcados como 'pagos' sem transação confirmada no gateway) e alguns clientes relataram cobranças duplicadas devido a múltiplos cliques no botão de checkout."

  questoes_objetivas:
    - id: "q1"
      enunciado: "Para evitar cobranças duplicadas quando um cliente clica repetidamente no botão de finalizar compra em uma requisição HTTP POST para a API de pagamento, qual padrão de arquitetura de software deve ser adotado pelo desenvolvedor?"
      alternativas:
        A: "Desabilitação do botão de submissão na interface do navegador web sem implementação de verificações de estado no serviço de backend."
        B: "Uso de chave de idempotência no cabeçalho HTTP da requisição, garantindo resposta única e consistente em tentativas repetidas do cliente."
        C: "Conversão do método HTTP POST para GET repassando dados de pagamento nos parâmetros da URL para simplificar o roteamento na camada web."
        D: "Bloqueio síncrono de todas as conexões do banco de dados na tabela transacional até que a primeira chamada finalize o processamento."
      gabarito: "B"
      justificativa: "A chave de idempotência (Idempotency Key) é o padrão de engenharia indicado para transações financeiras distribuídas, garantindo que retentativas com o mesmo identificador processem a cobrança uma única vez e retornem a resposta original em segurança. Controles restritos ao cliente web são facilmente burlados ou contornados por falhas de conexão, expor dados de cartões em métodos GET quebra normas de segurança e bloqueios síncronos globais inviabilizam a concorrência e a escalabilidade do sistema."
      requisitos_avaliados:
        - "programacao_sistemas_informaticos"
        - "resolver_problemas_sistemas_tic"

    - id: "q2"
      enunciado: "No desenvolvimento de uma funcionalidade de cancelamento de compras com reembolso automático, a equipe de produto define a regra de negócio: 'Clientes cadastrados podem solicitar reembolso integral em até 7 dias da compra caso o pedido não tenha sido despachado'. Para exercitar o processo de identificação e validação de requisitos de clientes no fluxo guiado por testes (TDD), qual conduta o desenvolvedor deve adotar prioritariamente?"
      alternativas:
        A: "Escrever primeiro a implementação do código na camada de serviços e deixar a especificação de testes para a fase pós-implantação."
        B: "Validar apenas o caminho feliz com datas recentes, dispensando a automação de casos de borda como pedidos já despachados pelo estoque."
        C: "Registrar as regras de reembolso em atas de reunião internas sem traduzi-las em asserções executáveis de software no pipeline de entrega."
        D: "Traduzir as regras de negócio em critérios de aceitação automatizados (cenários de teste unitário que falham) antes de escrever o código de produção."
      gabarito: "D"
      justificativa: "No fluxo de desenvolvimento orientado por testes (TDD), o levantamento e refinamento dos requisitos do cliente se materializam na criação prévia de testes automatizados que expressam os critérios de aceitação e comportamentos esperados (fase Red), garantindo que a implementação subsequente atenda estritamente à demanda funcional. Codificar sem testes adia a descoberta de divergências, ignorar casos de borda gera brechas contratuais no sistema e manter regras apenas em documentações estáticas impede a verificação contínua de conformidade."
      requisitos_avaliados:
        - "identificar_requisitos_clientes"
        - "testar_unidades_software"

    - id: "q3"
      enunciado: "Ao realizar uma transferência de saldo entre duas contas bancárias em banco de dados relacional (débito na conta A e crédito na conta B), qual propriedade das transações (ACID) garante que, caso o crédito na conta B falhe por queda de conexão, o débito na conta A seja automaticamente desfeito (rollback)?"
      alternativas:
        A: "Atomicidade, que assegura que todas as instruções do bloco transacional sejam concluídas com sucesso ou completamente revertidas."
        B: "Consistência, que estabelece que esquemas de chaves e restrições de integridade do banco devem ser validados após o encerramento da sessão."
        C: "Isolamento, que define a visibilidade de dados intermediários entre transações concorrentes através de diferentes níveis de bloqueio."
        D: "Durabilidade, que garante que alterações confirmadas por commit permaneçam gravadas em disco mesmo diante de falhas de energia do nó."
      gabarito: "A"
      justificativa: "A propriedade de Atomicidade no modelo ACID garante o princípio de integridade de tudo ou nada, revertendo automaticamente alterações parciais via rollback caso ocorra falha em qualquer etapa da transação. Consistência assegura o respeito às regras estruturais do banco, Isolamento disciplina a interferência entre operações simultâneas e Durabilidade preserva dados gravados contra perdas decorrentes de desligamentos físicos do servidor."
      requisitos_avaliados:
        - "sql"
        - "programacao_sistemas_informaticos"

    - id: "q4"
      enunciado: "Em um teste unitário de um serviço de emissão de notas fiscais que consome uma API externa do Ministério da Fazenda lenta e instável, qual é a boa prática recomendada para garantir que a suíte de testes seja rápida, determinística e execute offline?"
      alternativas:
        A: "Configurar pausas explícitas no código do teste para aguardar pacientemente o retorno da chamada remota contra o servidor governamental."
        B: "Desativar a execução de testes automatizados na classe fiscal integradora para contornar instabilidades passageiras de infraestrutura."
        C: "Empregar dublês de teste como mocks ou stubs para simular o comportamento da API remota sem tráfego de rede durante os testes de unidade."
        D: "Direcionar as chamadas da rotina fiscal diretamente para o ambiente de produção do órgão público para garantir fidelidade das respostas."
      gabarito: "C"
      justificativa: "Testes unitários devem isolar dependências externas voláteis por meio de dublês de teste (mocks e stubs), simulando contratos de resposta e cenários de erro com rapidez e sem necessidade de conexão à internet. Introduzir pausas prolonga a execução sem garantir estabilidade, desativar asserções retira a segurança contra regressões e executar chamadas reais contra órgãos externos acarreta custos, lentidão e risco de emissões indevidas."
      requisitos_avaliados:
        - "testar_unidades_software"
        - "executar_testes_software"

  questao_aberta:
    id: "qa1"
    enunciado: "Na plataforma de e-commerce 'ShopTech', durante a Black Friday, o serviço de finalização de compras (checkout) sofreu degradação severa: centenas de clientes conseguiram finalizar o pedido sem que o estoque do produto fosse reservado, gerando overbooking (venda de itens sem disponibilidade física). O código legado executava um SELECT na tabela de produtos seguido de um UPDATE no estoque em comandos isolados sem controle de concorrência. Como desenvolvedor de software, elabore uma solução técnica completa contendo: (1) a explicação da causa raiz do problema de concorrência (race condition / leitura suja); (2) a proposta de solução a nível de banco de dados e aplicação (ex: transações com bloqueio pessimista via SELECT FOR UPDATE ou controle de concorrência otimista com versionamento); e (3) a estrutura de um teste unitário ou de integração com asserções que provem a prevenção do overbooking em condições de múltiplas requisições simultâneas."
    requisitos_avaliados:
      - "programacao_sistemas_informaticos"
      - "sql"
      - "testar_unidades_software"
      - "resolver_problemas_sistemas_tic"
    rubrica:
      - id: "crit_diagnostico_concorrencia"
        descricao: "Avalia a precisão na identificação e explicação do problema de condição de corrida (race condition) entre threads."
        requisitos_avaliados:
          - "resolver_problemas_sistemas_tic"
          - "programacao_sistemas_informaticos"
        ancoras:
          0: "Não compreende o problema de concorrência, atribuindo a falha genericamente a lentidão ou erros de digitação."
          1: "Identifica que duas pessoas compraram ao mesmo tempo, mas não explica o mecanismo técnico da condição de corrida ou leitura concorrente."
          2: "Explica com clareza a condição de corrida (race condition) gerada pelo intervalo entre a leitura (SELECT) e a atualização (UPDATE) sem bloqueio atômico."

      - id: "crit_arquitetura_solucao"
        descricao: "Avalia a adequação da solução técnica proposta utilizando transações atômicas e controle de concorrência."
        requisitos_avaliados:
          - "sql"
          - "programacao_sistemas_informaticos"
        ancoras:
          0: "Propõe soluções ineficazes (como colocar sleep entre requisições ou tentar controlar concorrência no front-end)."
          1: "Sugere o uso de transações, mas sem especificar mecanismos de bloqueio (pessimista/otimista) ou tratamento de exceções de esgotamento de estoque."
          2: "Propõe solução robusta e justificada: transação ACID com bloqueio pessimista (SELECT ... FOR UPDATE) ou otimista com coluna de versão, com validação atômica no banco."

      - id: "crit_estrategia_testes"
        descricao: "Avalia a qualidade do teste automatizado concebido para reproduzir e impedir regressões de concorrência."
        requisitos_avaliados:
          - "testar_unidades_software"
          - "executar_testes_software"
        ancoras:
          0: "Não propõe testes automatizados ou sugere apenas teste manual após publicação em produção."
          1: "Propõe teste com chamadas sequenciais que não simulam a concorrência real entre duas ou mais requisições simultâneas."
          2: "Estrutura teste automatizado com concorrência simulada (ex: threads concorrentes, asyncio.gather ou locks) e asserções claras garantindo que apenas compras com estoque válido sejam confirmadas e as excedentes rejeitadas com erro controlado."

