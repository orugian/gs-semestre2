exercicio:
  id: "ex_analista_processos_01"
  versao: "0.1.0"
  tipo: "diagnostico_pratico_didatico"
  requisitos_nao_avaliados:
    - "analisar_dados"
    - "garantia_qualidade_dados"
  cenario: "Cenário didático e sintético: A distribuidora de medicamentos 'FarmaLog' enfrenta atrasos crônicos no processo de conferência e expedição de pedidos para hospitais conveniados. O tempo total médio desde a aprovação do pedido até a expedição aumentou de 4 horas para 14 horas no último trimestre, gerando reclamações sobre quebra de SLA. O analista de processos foi designado para mapear o fluxo atual (AS-IS), identificar desperdícios e riscos operacionais e propor o redesenho (TO-BE)."

  questoes_objetivas:
    - id: "q1"
      enunciado: "Na notação BPMN 2.0, ao modelar um processo em que a separação de medicamentos refrigerados e medicamentos secos ocorre simultaneamente em linhas distintas e o empacotamento final só pode começar após a conclusão de ambas as separações, quais elementos de gateway devem ser utilizados para a divisão e para a convergência dos fluxos?"
      alternativas:
        A: "Gateway Exclusivo (XOR) para bifurcar os caminhos conforme o tipo do item e Gateway Paralelo (AND) para aguardar o lote final."
        B: "Gateway Inclusivo (OR) para direcionar as etapas baseado em regras de negócio e Gateway Exclusivo (XOR) na junção de expedição."
        C: "Gateway Paralelo (AND) para bifurcar o fluxo simultaneamente e Gateway Paralelo (AND) para sincronizar o encerramento conjunto."
        D: "Gateway Baseado em Eventos para aguardar mensagens das docas e Gateway Complexo com expressões condicionais para a convergência."
      gabarito: "C"
      justificativa: "O Gateway Paralelo (AND) é o elemento padrão na notação BPMN 2.0 para modelar atividades executadas concorrentemente e sincronizar a convergência de todos os ramos antes da etapa seguinte. O Gateway Exclusivo seleciona apenas uma rota alternativa, o Gateway Inclusivo depende de condições lógicas dinâmicas sem sincronismo obrigatório e o Gateway de Eventos reage a sinais externos em vez de orquestrar tarefas concorrentes."
      requisitos_avaliados:
        - "criar_modelos_processos_empresariais"
        - "processos_empresariais"

    - id: "q2"
      enunciado: "O analista coletou dados dos últimos 200 atrasos de expedição e categorizou as causas: Falta de assinatura manual do farmacêutico (124 ocorrências), Divergência de lote no leitor óptico (42 ocorrências), Queda momentânea da impressora térmica (18 ocorrências) e Outras causas dispersas (16 ocorrências). Qual ferramenta da qualidade e conclusão imediata fundamentam a priorização das melhorias?"
      alternativas:
        A: "Histograma de frequências contínuas, apontando que a distribuição dos erros segue uma curva normal com dispersão homogênea."
        B: "Gráfico de dispersão cartesiano, correlacionando o número de impressões diárias com a temperatura interna das docas de carga."
        C: "Diagrama de causa e efeito (Ishikawa), recomendando intervenção simultânea em todas as causas levantadas sem distinção de impacto."
        D: "Gráfico de Pareto, evidenciando que duas categorias principais concentram mais de 80% das falhas e demandam ação prioritária."
      gabarito: "D"
      justificativa: "O Gráfico de Pareto aplica o princípio 80/20 ordenando causas por frequência decrescente e curva acumulada, demonstrando que assinatura manual e divergência de lote respondem por 83% dos incidentes. Histogramas analisam dispersão de variáveis quantitativas, diagramas de dispersão examinam relação entre duas variáveis contínuas e diagramas de Ishikawa mapeiam hipóteses qualitativas sem quantificar a relevância de cada ocorrência."
      requisitos_avaliados:
        - "realizar_apresentacao_visual_dados"
        - "analisar_processos_empresariais"

    - id: "q3"
      enunciado: "Ao avaliar o risco de automatizar a conferência de medicamentos via leitor de código de barras 2D em substituição à conferência física manual, qual risco operacional crítico deve ser previsto na matriz de análise de riscos (FMEA) e qual respectiva salvaguarda deve ser implementada?"
      alternativas:
        A: "Risco de leitura incorreta em lotes similares; salvaguarda com dupla validação sistêmica contra o prontuário eletrônico do paciente."
        B: "Risco de variação no preço das etiquetas de código de barras; salvaguarda com renegociação periódica com fornecedores gráficos."
        C: "Risco de desmotivação dos operadores de estoque; salvaguarda com manutenção integral da checagem em papel paralelamente ao leitor."
        D: "Risco de obsolescência tecnológica dos terminais; salvaguarda com substituição preventiva dos equipamentos a cada fechamento de mês."
      gabarito: "A"
      justificativa: "Na dispensação hospitalar, a troca inadvertida de dosagem ou princípio ativo constitui o risco de maior severidade assistencial, exigindo conferência cruzada com a prescrição médica digital antes da liberação. Custos de insumos referem-se a riscos financeiros de suprimentos, manter processos manuais paralelos anula os ganhos de produtividade da automação e trocar coletores mensalmente eleva despesas sem mitigar falhas operacionais."
      requisitos_avaliados:
        - "efetuar_analise_riscos"
        - "identificar_requisitos_clientes"

    - id: "q4"
      enunciado: "No mapeamento do processo atual, constatou-se que após a separação dos produtos os pedidos ficam em média 5 horas parados em carrinhos aguardando a assinatura física de um único supervisor, enquanto o tempo de assinatura em si consome menos de 2 minutos por lote. Sob a ótica da metodologia Lean de processos, como essa espera deve ser classificada e tratada?"
      alternativas:
        A: "Desperdício por superprocessamento; deve ser mitigado com adição de formulários impressos para detalhar o histórico das checagens."
        B: "Desperdício por tempo de espera em fila; deve ser mitigado com aprovação por alçada digital no sistema e regras automáticas de liberação."
        C: "Desperdício por movimentação física; deve ser mitigado aproximando as bancadas de separação da sala de convivência da supervisão."
        D: "Atividade essencial de agregação de valor; deve ser mantida integralmente ampliando o número de assinaturas exigidas por protocolo."
      gabarito: "B"
      justificativa: "Lotes parados aguardando assinaturas constituem desperdício clássico de espera na metodologia Lean, gerando atraso sem agregar valor perceptível ao cliente final. Criar mais formulários amplia a burocracia, mover bancadas apenas mascara a dependência de aprovação manual e classificar esperas ociosas como valor agregado distorce os fundamentos da melhoria contínua de processos."
      requisitos_avaliados:
        - "analisar_processos_empresariais"
        - "processos_empresariais"

  questao_aberta:
    id: "qa1"
    enunciado: "Na distribuidora 'FarmaLog', o diretor de operações solicita uma proposta estruturada para reformular o processo de separação e expedição de pedidos emergenciais para UTIs, que hoje sofre com extravios e tempos imprevisíveis. Elabore uma proposta de melhoria contendo: (1) o redesenho conceitual do fluxo (TO-BE), destacando os papéis das áreas envolvidas (comercial, farmácia e expedição) e os pontos de checagem; (2) a identificação dos 2 maiores riscos de ruptura na transição e as respectivas ações de contingência; e (3) a definição de 2 indicadores-chave de processo (KPIs) com meta e fórmula clara para monitorar a eficácia da nova rotina."
    requisitos_avaliados:
      - "criar_modelos_processos_empresariais"
      - "analisar_processos_empresariais"
      - "efetuar_analise_riscos"
      - "identificar_requisitos_clientes"
    rubrica:
      - id: "crit_redesenho_fluxo"
        descricao: "Avalia a consistência e clareza do fluxo de trabalho proposto (TO-BE), separação de papéis e eliminação de gargalos."
        requisitos_avaliados:
          - "criar_modelos_processos_empresariais"
          - "analisar_processos_empresariais"
        ancoras:
          0: "Não propõe redesenho de fluxo ou apresenta etapas confusas sem definição de responsabilidades entre áreas."
          1: "Descreve um novo fluxo de forma genérica, sem detalhar os pontos de decisão, handoffs ou mecanismos de agilidade para pedidos emergenciais."
          2: "Apresenta fluxo TO-BE claro e enxuto, com separação nítida de papéis (raias/responsáveis), conferência digital e rota expressa para emergências."

      - id: "crit_gestao_riscos"
        descricao: "Avalia a solidez na identificação de riscos operacionais durante a implementação e a eficácia dos planos de contingência."
        requisitos_avaliados:
          - "efetuar_analise_riscos"
        ancoras:
          0: "Ignora riscos operacionais ou propõe mitigações superficiais sem viabilidade prática."
          1: "Identifica riscos pertinentes, mas as ações preventivas são tímidas ou não evitam a parada da expedição hospitalar."
          2: "Mapeia os riscos críticos de transição (ex: falha de integração no leitor, resistência operacional) e apresenta contingências robustas com salvaguardas claras."

      - id: "crit_indicadores_kpis"
        descricao: "Avalia a formulação técnica dos indicadores de desempenho (KPIs), alinhamento com a necessidade do cliente e acionabilidade."
        requisitos_avaliados:
          - "identificar_requisitos_clientes"
          - "analisar_processos_empresariais"
        ancoras:
          0: "Não apresenta KPIs ou propõe métricas subjetivas e sem fórmula."
          1: "Apresenta métricas operacionais válidas, mas com fórmulas incompletas ou sem alinhamento direto aos prazos hospitalares."
          2: "Define dois KPIs objetivos e acionáveis (ex: Lead Time de Expedição Emergencial e Taxa de Acurácia de Pedido Perfeito / OTIF), com fórmulas, metas e periodicidade."

