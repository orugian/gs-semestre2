exercicio:
  id: "ex_analista_suporte_infra_01"
  versao: "0.1.0"
  tipo: "diagnostico_pratico_didatico"
  requisitos_nao_avaliados:
    - "elaborar_documentacao_tecnica"
  cenario: "Cenário didático e sintético: A sede corporativa da empresa 'LogExpress' possui 180 colaboradores conectados a uma rede local (LAN) com servidores internos de arquivos (NFS/SMB) e acesso a aplicações web via link de internet dedicado. Na manhã de segunda-feira, diversos colaboradores abrem chamados simultâneos relatando incapacidade de acessar sites externos e lentidão extrema para abrir pastas de rede compartilhadas, enquanto alguns departamentos afirmam conseguir navegar normalmente utilizando endereços IP numéricos."

  questoes_objetivas:
    - id: "q1"
      enunciado: "Os usuários relatam que conseguem acessar um servidor de destino digitando diretamente seu endereço IP (ex: http://192.168.10.50), porém ao digitar o nome de domínio corporativo interno (ex: intranet.empresa.local) o navegador retorna erro 'Host não encontrado'. Qual serviço de infraestrutura de rede é a provável causa raiz da falha?"
      alternativas:
        A: "Serviço de resolução de nomes de domínio (DNS) inativo ou com encaminhadores corporativos desconfigurados na rede local."
        B: "Serviço de configuração dinâmica de endereços de rede (DHCP) com escopo de concessão esgotado para novas estações clientes."
        C: "Roteador de borda principal com tabela de rotas corrompida bloqueando pacotes direcionados à sub-rede dos servidores internos."
        D: "Regra restritiva no firewall corporativo filtrando portas de aplicação web para todo o tráfego originado nas estações de trabalho."
      gabarito: "A"
      justificativa: "O acesso bem-sucedido via endereço IP confirma que conectividade física, protocolos de roteamento e portas de aplicação estão operantes, isolando a inconsistência no serviço DNS encarregado de traduzir nomes de domínio em endereços IP. Esgotamento de DHCP impediria novas estações de obter conectividade básica, falhas no roteador inviabilizariam o tráfego por IP e bloqueios de firewall na porta web impediriam conexões em ambas as formas de chamada."
      requisitos_avaliados:
        - "protocolos_comunicacao_tic"
        - "resolver_problemas_sistemas_tic"

    - id: "q2"
      enunciado: "Um analista de suporte precisa verificar no servidor Linux quais portas de rede estão atualmente abertas e escutando conexões (LISTEN), além dos processos responsáveis por elas. Qual comando no terminal Linux executa essa inspeção de forma moderna e padrão?"
      alternativas:
        A: "ping -c 4 localhost para checar a integridade da pilha de protocolos TCP/IP e o tempo de resposta do loopback local."
        B: "ifconfig -a para listar os endereços físicos de hardware (MAC) e os identificadores das interfaces ativas no sistema."
        C: "ss -tulpn para inspecionar sockets TCP e UDP em estado de escuta com identificadores numéricos e processos vinculados."
        D: "traceroute 127.0.0.1 para mapear a quantidade de saltos lógicos percorridos até o gateway padrão de saída da empresa."
      gabarito: "C"
      justificativa: "O utilitário ss com parâmetros para TCP (-t), UDP (-u), sockets em escuta (-l), processos (-p) e resolução numérica (-n) é a ferramenta padrão em ambientes Linux modernos para auditar serviços de rede ativos. O comando ping apenas verifica conectividade básica via pacotes ICMP, ifconfig exibe configurações das interfaces de rede sem listar portas de escuta e traceroute diagnostica rotas de roteamento externo."
      requisitos_avaliados:
        - "administrar_sistemas_informaticos"
        - "resolver_problemas_sistemas_tic"

    - id: "q3"
      enunciado: "O painel de monitoramento do servidor de arquivos emite alerta crítico indicando que o volume de armazenamento principal atingiu 98% de ocupação, com taxa de crescimento contínua de 500 MB por hora. Qual ação imediata deve ser executada pelo administrador de infraestrutura para evitar a indisponibilidade total dos serviços?"
      alternativas:
        A: "Reinicializar o servidor corporativo para descarregar o cache de memória e aguardar estabilização do disco em produção."
        B: "Ativar compressão nativa em toda a partição do sistema operacional sem checar a origem dos arquivos que estão crescendo."
        C: "Apagar diretamente pastas ativas de banco de dados para recuperar espaço imediato sem validação prévia de integridade."
        D: "Localizar diretórios com retenção anômala de logs ou arquivos temporários, realizar expurgo seguro e planejar expansão de partição."
      gabarito: "D"
      justificativa: "A intervenção correta consiste em mapear a causa do crescimento anormal (como falhas no logrotate ou despejos temporários), liberar espaço de forma criteriosa e expandir o volume lógico via LVM antes do esgotamento da partição. Reinicializações não liberam espaço persistente consumido, compressão em tempo real eleva uso de CPU sem conter a gravação contínua e exclusões sem triagem arriscam corromper arquivos vitais de produção."
      requisitos_avaliados:
        - "manutencao_sistemas_informaticos"
        - "monitorizar_desempenho_sistemas"

    - id: "q4"
      enunciado: "Ao analisar os registros de auditoria (logs do firewall e SSH), o analista identifica milhares de tentativas consecutivas de conexão vindas de um endereço IP externo desconhecido na porta padrão 22, tentando autenticar contas como 'root', 'admin' e 'test'. Qual tipo de ataque isso caracteriza e qual medida técnica mitiga imediatamente esse risco?"
      alternativas:
        A: "Negação de serviço distribuída (DDoS); contingência com alteração emergencial dos servidores DNS primários e secundários."
        B: "Força bruta direcionada ao serviço SSH; contingência com bloqueio por firewall, desativação de login root e uso de fail2ban ou chaves."
        C: "Injeção de código em banco de dados (SQL Injection); contingência com reinstalação das tabelas e expurgo da base transacional."
        D: "Envenenamento de cache local (ARP Spoofing); contingência com substituição física das placas de rede nos servidores afetados."
      gabarito: "B"
      justificativa: "Tentativas repetitivas de adivinhação de credenciais contra portas de gerência tipificam ataque de força bruta, mitigado eficazmente por restrição de acesso em nível de firewall ou VPN, desabilitação de autenticação direta para contas privilegiadas e filtros como fail2ban ou pares de chaves criptográficas. Ataques de negação de serviço saturam banda em vez de autenticar contas, injeções SQL exploram aplicações web em portas HTTP e falsificação ARP atua no enlace de redes locais."
      requisitos_avaliados:
        - "identificar_riscos_seguranca_informatica"
        - "administrar_sistemas_informaticos"

  questao_aberta:
    id: "qa1"
    enunciado: "Durante o expediente na 'LogExpress', o servidor principal de autenticação e arquivos para de responder. Os 180 colaboradores perdem acesso simultâneo às suas estações de trabalho e arquivos de rede. O telefone do suporte toca ininterruptamente e o diretor de operações exige restabelecimento imediato. Como analista de suporte e infraestrutura de TI, elabore um plano de resposta a incidentes contendo: (1) o procedimento inicial de comunicação e triagem para organizar o atendimento e evitar sobrecarga na equipe; (2) o checklist de contingência técnica para investigar hardware, hipervisor, sistema operacional e conectividade de rede; e (3) a estratégia de recuperação (DRP) com restauração de backup e teste de integridade pós-restabelecimento."
    requisitos_avaliados:
      - "resolver_problemas_sistemas_tic"
      - "administrar_sistemas_informaticos"
      - "apoiar_utilizadores_sistemas_informaticos"
      - "manutencao_sistemas_informaticos"
    rubrica:
      - id: "crit_comunicacao_triagem"
        descricao: "Avalia a estruturação da comunicação com usuários e liderança durante incidentes de alta severidade (Sev-1)."
        requisitos_avaliados:
          - "apoiar_utilizadores_sistemas_informaticos"
        ancoras:
          0: "Não propõe canal de comunicação oficial, deixando usuários sem informação ou atendendo chamados repetidos sem critério."
          1: "Descreve comunicado genérico sem definir responsáveis pela comunicação ou sem estimativa de SLA/atualização periódica."
          2: "Estabelece protocolo de crise com mensagem broadcast imediata aos usuários, ponto único de contato (SPOC) e atualizações com prazos transparentes."

      - id: "crit_troubleshooting_infra"
        descricao: "Avalia o método técnico de investigação em camadas para identificação e resolução da causa raiz."
        requisitos_avaliados:
          - "resolver_problemas_sistemas_tic"
          - "administrar_sistemas_informaticos"
        ancoras:
          0: "Propõe ações desordenadas sem seguir modelo lógico de isolamento de falhas."
          1: "Investiga apenas uma camada superficial (ex: reiniciar sem olhar logs de kernel ou console do hipervisor)."
          2: "Apresenta checklist metódico em camadas (energia/hardware físico, hipervisor/VMware/Proxmox, logs de boot/dmesg do SO e serviços de rede)."

      - id: "crit_recuperacao_resiliencia"
        descricao: "Avalia a consistência do plano de restauração de desastres (DRP), teste de integridade e pós-mórtem do incidente."
        requisitos_avaliados:
          - "manutencao_sistemas_informaticos"
          - "administrar_sistemas_informaticos"
        ancoras:
          0: "Não contempla plano de backup/restauração ou considera o incidente encerrado sem testar o acesso dos usuários."
          1: "Cita restauração de backup mas não define procedimento de verificação de consistência nem confecção de relatório de causa raiz."
          2: "Especifica procedimento rigoroso de restauração de snapshot/backup imutável, checagem cruzada de integridade de dados e confecção de relatório pós-mórtem com ações preventivas."

