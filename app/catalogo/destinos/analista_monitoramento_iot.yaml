exercicio:
  id: "ex_analista_monitoramento_iot_01"
  versao: "0.1.0"
  tipo: "diagnostico_pratico_didatico"
  requisitos_nao_avaliados:
    - "analisar_dados"
  cenario: "Cenário didático e sintético: Uma célula robotizada de manufatura possui um dispositivo de borda (edge) instrumentado com sensores de telemetria que publica medições via MQTT. O monitoramento obedece rigorosamente aos limiares versionados do sistema (app/config/limiares.json): para temperatura_c, normal é v < 35.0, atencao é 35.0 <= v < 45.0 e critico é v >= 45.0; para distancia_cm, normal é v > 15.0, atencao é 8.0 < v <= 15.0 e critico é 0.0 <= v <= 8.0. Em estado de atencao o LED acende (status ALERTA); em estado critico o LED e o buzzer são ativados simultaneamente (status ALERTA)."

  questoes_objetivas:
    - id: "q1"
      enunciado: "O sistema de telemetria do robô registra as seguintes leituras pontuais: temperatura_c = 38.0 °C e distancia_cm = 12.0 cm. De acordo com as regras de limiares versionadas do sistema, qual é a classificação de risco da célula e o estado esperado dos atuadores (LED e buzzer)?"
      alternativas:
        A: "Classe normal: atuador LED desligado e buzzer desligado, mantendo o firmware em status OK sem emissão de alertas na célula."
        B: "Classe atencao: atuador LED ligado e buzzer desligado, mantendo o firmware em status ALERTA de conformidade com os limiares."
        C: "Classe critico: atuador LED ligado e buzzer ligado, disparando alarme sonoro contínuo com acionamento simultâneo na bancada."
        D: "Classe atencao: atuador LED desligado e buzzer ligado, mantendo o firmware em status OK com disparo sonoro intermitente na linha."
      gabarito: "B"
      justificativa: "Segundo as regras do sistema, temperatura entre 35.0 °C e 45.0 °C e distância entre 8.0 cm e 15.0 cm configuram estado de atenção. Nessa classe, o protocolo determina acionamento visual exclusivo por LED e status em ALERTA, reservando o buzzer para o estado crítico quando temperatura atinge 45.0 °C ou distância cai para 8.0 cm ou menos."
      requisitos_avaliados:
        - "monitorizar_desempenho_sistemas"
        - "sensores"

    - id: "q2"
      enunciado: "Em uma aplicação industrial com conexão de rede sem fio sujeita a instabilidade passageira, mensagens críticas de alarme de sobreaquecimento (temperatura >= 45.0 °C) não podem ser perdidas, mas a rede possui banda limitada. No protocolo MQTT, qual nível de QoS (Quality of Service) é mais indicado para assegurar a entrega garantida do pacote de alarme sem sobrecarga desnecessária?"
      alternativas:
        A: "QoS 0 (At most once), que publica as mensagens no broker sem confirmação de entrega para economizar pacotes de rede sem fio."
        B: "QoS 2 (Exactly once), que utiliza aperto de mão em quatro etapas para impedir qualquer mensagem duplicada na transmissão."
        C: "QoS 1 (At least once), que assegura a entrega com confirmação PUBACK através de retransmissão e baixo overhead de comunicação."
        D: "Substituição do broker MQTT por datagramas UDP sem controle de fluxo, dependendo de retransmissões manuais no microcontrolador."
      gabarito: "C"
      justificativa: "O nível QoS 1 garante a recepção da mensagem pelo broker através de confirmação PUBACK com baixo overhead, sendo ideal para alarmes em que eventuais duplicatas são tratadas pela estampa de tempo. O nível QoS 0 não oferece garantia contra perda em conexões instáveis, QoS 2 gera atrasos excessivos em quatro vias em redes congestionadas e datagramas UDP puros não oferecem entrega garantida."
      requisitos_avaliados:
        - "protocolos_comunicacao_tic"
        - "internet_das_coisas"

    - id: "q3"
      enunciado: "Um sensor ultrassônico que monitora o perímetro da prensa repentinamente emite leituras intermitentes de 0.0 cm intercaladas com 25.0 cm a cada 100 ms, enquanto a prensa está em repouso. O operador percebe que cabos de potência de inversores de frequência foram recentemente instalados no mesmo eletroduto. Qual é o diagnóstico mais plausível e a conduta técnica prioritária?"
      alternativas:
        A: "Ajuste da calibração por software adicionando uma constante de compensação matemática para anular as leituras zeradas do sensor."
        B: "Substituição imediata do transdutor ultrassônico por um modelo idêntico sob a premissa de falha de desgaste físico nos componentes."
        C: "Aumento da frequência de varredura do conversor analógico-digital para capturar mais amostras por segundo sem alterar a infraestrutura."
        D: "Indução eletromagnética no sinal por proximidade de cabos de força, exigindo segregação em eletrodutos próprios e cabeamento blindado aterrado."
      gabarito: "D"
      justificativa: "Cabos de potência de inversores geram ruído eletromagnético de alta frequência (EMI) nas linhas vizinhas, induzindo picos espúrios de tensão. A conduta correta é segregar o cabeamento de sinal em conduto metálico separado e empregar cabo blindado aterrado. Modificações de software mascaram a interferência física, trocar a peça mantém o circuito exposto ao ruído e elevar a amostragem apenas amplifica a coleta de dados corrompidos."
      requisitos_avaliados:
        - "resolver_problemas_sistemas_tic"
        - "sensores"

    - id: "q4"
      enunciado: "O gateway de telemetria precisa armazenar medições em caso de queda de link com o servidor em nuvem e retransmiti-las em ordem assim que a conexão for restabelecida, evitando sobrecarga de memória RAM no nó de borda. Qual mecanismo deve ser implementado no firmware do nó coletor?"
      alternativas:
        A: "Fila circular em memória persistente com limite de descarte por tempo (TTL) e descarregamento ordenado em lotes após a reconexão da rede."
        B: "Armazenamento de leituras em lista encadeada na memória RAM dinâmica do microcontrolador sem limite de retenção até o retorno da nuvem."
        C: "Gravação de cada nova leitura no mesmo endereço de memória flash sobrescrevendo os dados anteriores para economizar espaço de partição."
        D: "Bloqueio de novas leituras dos sensores mantendo o firmware em espera ativa síncrona até que o broker MQTT volte a responder requisições."
      gabarito: "A"
      justificativa: "Uma fila circular não volátil com controle de TTL e política FIFO garante a preservação dos dados durante a indisponibilidade sem esgotar a memória do dispositivo de borda. Reter registros na RAM causa estouro de memória e reinicializações indesejadas, sobrescrever a mesma posição apaga o histórico de telemetria e aplicar espera ativa bloqueia o processamento em tempo real de sensores e atuadores de segurança."
      requisitos_avaliados:
        - "gerir_sistemas_recolha_dados"
        - "garantia_qualidade_dados"

  questao_aberta:
    id: "qa1"
    enunciado: "Em uma célula de estampagem industrial automatizada, a esteira transportadora possui um dispositivo de borda que afere temperatura_c do motor e distancia_cm de segurança do operador. Os limiares de segurança vigentes são: alerta de atenção para temperatura >= 35.0 °C e distância <= 15.0 cm; alarme crítico para temperatura >= 45.0 °C e distância <= 8.0 cm. Em uma inspeção, foi constatado que durante 15 minutos o nó publicou leituras de temperatura de 48.0 °C e distância de 5.0 cm, porém nem o LED nem o buzzer foram acionados, e o painel de nuvem permaneceu exibindo status anterior como 'normal'. Como analista de monitoramento IoT, estruture um plano de ação técnico contendo: (1) as hipóteses de falha divididas entre camada física/borda (sensores e atuadores), camada de firmware (lógica local de acionamento) e camada de rede (publicação MQTT/broker); (2) o procedimento passo a passo para testar e isolar onde ocorreu o bloqueio; e (3) a implementação de um mecanismo de 'heartbeat/watchdog' e redundância para impedir que falhas de acionamento passem despercebidas."
    requisitos_avaliados:
      - "monitorizar_desempenho_sistemas"
      - "resolver_problemas_sistemas_tic"
      - "protocolos_comunicacao_tic"
      - "gerir_sistemas_recolha_dados"
    rubrica:
      - id: "crit_hipoteses_diagnostico"
        descricao: "Avalia a capacidade analítica de formular hipóteses estruturadas cobrindo borda, rede e firmware."
        requisitos_avaliados:
          - "resolver_problemas_sistemas_tic"
          - "monitorizar_desempenho_sistemas"
        ancoras:
          0: "Não identifica as possíveis camadas de falha ou atribui o erro genericamente ao computador sem método."
          1: "Identifica falha em apenas uma das camadas (apenas rede ou apenas hardware local), sem visão de sistema integrado."
          2: "Formula hipóteses abrangentes e consistentes (falha na GPIO dos atuadores, congelamento de thread no firmware, retenção de mensagens MQTT antigas ou falha de conexão)."

      - id: "crit_metodologia_isolamento"
        descricao: "Avalia a aplicação metódica de testes de bancada e inspeção de fluxo de dados para isolar a causa raiz."
        requisitos_avaliados:
          - "resolver_problemas_sistemas_tic"
          - "protocolos_comunicacao_tic"
        ancoras:
          0: "Propõe ações aleatórias (como trocar peças sem testar) ou procedimentos que comprometem a segurança da célula."
          1: "Descreve testes parciais (ex: reiniciar o gateway), mas sem medição com multímetro/osciloscópio ou inspeção dos tópicos MQTT no broker."
          2: "Apresenta roteiro metódico de isolamento: teste elétrico de GPIO/atuadores, injeção de carga de teste via comando local e monitoramento de logs MQTT."

      - id: "crit_resiliencia_e_seguranca"
        descricao: "Avalia a qualidade das soluções de engenharia para assegurar fail-safe, watchdogs e supervisão em tempo real."
        requisitos_avaliados:
          - "gerir_sistemas_recolha_dados"
          - "protocolos_comunicacao_tic"
        ancoras:
          0: "Não propõe mecanismos de contingência, watchdog ou monitoramento de conectividade."
          1: "Menciona watchdog de forma genérica sem explicar como garantir o estado de segurança (fail-safe) caso o nó trave."
          2: "Especifica rotinas de heartbeat com timeout para alerta de dispositivo offline, watchdog de hardware e circuito independente de desligamento de emergência (fail-safe)."

