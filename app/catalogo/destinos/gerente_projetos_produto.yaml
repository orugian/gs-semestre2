exercicio:
  id: "ex_gerente_projetos_produto_01"
  versao: "0.1.0"
  tipo: "diagnostico_pratico_didatico"
  requisitos_nao_avaliados:
    - "analisar_processos_empresariais"
  cenario: "Cenário didático e sintético: A fintech 'CréditoAgil' está desenvolvendo um novo módulo de concessão instantânea de microcrédito no aplicativo móvel. O lançamento está agendado para daqui a 8 semanas para coincidir com uma campanha nacional de marketing. Faltando 4 semanas para o prazo final, o time de engenharia descobre que a integração com o bureau externo de crédito possui latência excessiva (média de 12 segundos) e taxa de erro de 15%, o que inviabiliza a aprovação imediata prometida pelo comercial."

  questoes_objetivas:
    - id: "q1"
      enunciado: "Na metodologia Scrum, quando o Product Owner e os desenvolvedores identificam no meio da sprint que uma funcionalidade estimada em 13 pontos não será concluída devido a bloqueios técnicos externos imprevistos, qual é a conduta correta de acordo com as boas práticas ágeis?"
      alternativas:
        A: "Cancelar unilateralmente a sprint vigente e reiniciar o planejamento de todo o backlog do zero com a equipe de desenvolvimento."
        B: "Exigir horas extras emergenciais do time técnico para entregar o pacote completo sem alterar o escopo acordado no planejamento."
        C: "Marcar a história como concluída sem validação de testes automatizados para manter a velocidade prevista no gráfico de burndown."
        D: "Repactuar o escopo com o Product Owner, desmembrando o item para entregar valor parcial e expondo o impedimento na reunião diária."
      gabarito: "D"
      justificativa: "O framework Scrum orienta que impedimentos detectados durante a iteração sejam tratados com transparência e adaptação contínua, negociando escopo entre equipe e Product Owner para preservar a meta da sprint. Cancelar a sprint é medida drástica reservada para obsolescência de meta, impor horas extras degrada o ritmo sustentável e aprovar itens incompletos viola a definição de pronto (DoD)."
      requisitos_avaliados:
        - "gestao_agil_projetos"
        - "avaliar_planos_projetos"

    - id: "q2"
      enunciado: "O diretor comercial exige que todas as 15 regras de validação cadastral manual sejam incluídas na primeira versão de lançamento (MVP) daqui a 4 semanas. A equipe técnica aponta que isso exigirá 16 semanas de desenvolvimento. Como o gerente de produto deve negociar esse impasse com o stakeholder?"
      alternativas:
        A: "Empregar métodos de priorização como MoSCoW ou RICE para focar o MVP nas regras críticas e planejar as demais em versões futuras."
        B: "Comprometer-se formalmente com o prazo de 4 semanas sem alterar o escopo, atribuindo futuros atrasos à sobrecarga dos engenheiros."
        C: "Rejeitar sumariamente a solicitação comercial sem apresentar dados de capacidade técnica ou alternativas de viabilidade para o negócio."
        D: "Reduzir o prazo de entrega eliminando as etapas de validação de segurança e testes unitários para cumprir a demanda integral no prazo."
      gabarito: "A"
      justificativa: "A negociação produtiva orientada a valor utiliza frameworks objetivos de priorização para calibrar expectativas, viabilizando o lançamento dentro do prazo com núcleo indispensável de segurança e escalonando as demais regras para releases subsequentes. Prometer prazos inviáveis compromete a previsibilidade, recusar sem diálogo rompe pontes com a liderança e suprimir testes acarreta riscos severos de conformidade regulatória."
      requisitos_avaliados:
        - "negociar_partes_interessadas"
        - "identificar_requisitos_clientes"

    - id: "q3"
      enunciado: "Ao registrar o risco da lentidão do bureau de crédito na Matriz de Riscos do projeto, como o gerente deve categorizar o risco e qual plano de contingência técnico deve ser proposto?"
      alternativas:
        A: "Probabilidade baixa e impacto mínimo; plano de aceitação passiva sem necessidade de ajustes arquiteturais no fluxo do aplicativo."
        B: "Probabilidade alta e impacto alto; contingência com arquitetura assíncrona, notificações push e política de cache para consultas."
        C: "Probabilidade incerta e impacto total; encerramento definitivo da iniciativa de microcrédito e rescisão imediata com parceiros."
        D: "Probabilidade moderada e impacto baixo; transferência da responsabilidade operacional ao cliente final por meio de termos de uso."
      gabarito: "B"
      justificativa: "Com 15% de erro e 12 segundos de latência, o evento possui probabilidade elevada e forte impacto na retenção de usuários, demandando mitigação técnica por chamadas assíncronas, retorno transparente via push e cache de dados transacionais. Desconsiderar o evento causa abandono de checkout, cancelar a operação interrompe o planejamento estratégico e transferir a responsabilidade via termos de uso prejudica a experiência e a imagem da marca."
      requisitos_avaliados:
        - "efetuar_analise_riscos"
        - "gestao_projetos"

    - id: "q4"
      enunciado: "Ao redigir uma história de usuário (User Story) para a jornada de contratação de microcrédito, qual formato garante clareza de valor para o cliente e critérios de aceitação objetivos para o time de qualidade?"
      alternativas:
        A: "Descrição exclusiva do esquema físico de banco de dados e rotas da API REST sem vinculação direta à jornada do usuário final."
        B: "Definição genérica solicitando que a contratação de crédito seja simples, intuitiva e agradável para os correntistas do banco."
        C: "Estrutura padrão de persona, desejo e benefício, complementada por cenários de aceitação em formato Dado, Quando e Então (BDD)."
        D: "Lista sequencial de tarefas operacionais de desenvolvimento com datas de início e término estimadas em horas individuais de trabalho."
      gabarito: "C"
      justificativa: "A formulação canônica de história de usuário explicita o público, o objetivo prático e a entrega de valor, permitindo que cenários em linguagem BDD orientem tanto o desenvolvimento quanto os testes automatizados de aceitação. Especificações restritas ao backend ignoram a experiência do cliente, descrições subjetivas não fornecem critérios verificáveis e listas cronológicas de tarefas não comunicam valor funcional."
      requisitos_avaliados:
        - "elaborar_documentacao_tecnica"
        - "identificar_requisitos_clientes"

  questao_aberta:
    id: "qa1"
    enunciado: "Você é o Gerente de Produto encarregado do lançamento do módulo de microcrédito da fintech 'CréditoAgil'. Faltando 4 semanas para o lançamento e com a campanha de marketing agendada, o fornecedor de bureau de crédito externo comunica que não conseguirá reduzir a latência de 12 segundos e a taxa de erro de 15% antes da data acordada. A diretoria executiva pressiona pela manutenção do prazo original, mas o líder técnico afirma que a experiência atual causará avalanches de reclamações no Procon e churn. Elabore um plano estratégico de gestão de produto e projeto contendo: (1) a estratégia de renegociação de escopo/jornada com os stakeholders de negócios para viabilizar um lançamento seguro no prazo (MVP adaptado); (2) o desenho da nova experiência do usuário (UX assíncrona/degradada graciosa) mitigando a frustração da espera; e (3) a definição de 2 critérios de aceite definitivos (Go/No-Go) que o produto precisa obrigatoriamente atingir antes da liberação nas lojas de aplicativos."
    requisitos_avaliados:
      - "negociar_partes_interessadas"
      - "avaliar_planos_projetos"
      - "efetuar_analise_riscos"
      - "elaborar_documentacao_tecnica"
    rubrica:
      - id: "crit_renegociacao_stakeholders"
        descricao: "Avalia a habilidade de negociação de prazos e alinhamento de expectativas sem comprometer a estabilidade do produto."
        requisitos_avaliados:
          - "negociar_partes_interessadas"
          - "avaliar_planos_projetos"
        ancoras:
          0: "Não propõe estratégia de negociação, cedendo cegamente à pressão executiva ou sugerindo cancelamento sumário do projeto."
          1: "Propõe negociar apenas com os desenvolvedores ou apresenta um plano de comunicação vago com a diretoria."
          2: "Apresenta estratégia estruturada de alinhamento com dados de impacto, propondo faseamento por cohort/soft-launch e revisão de metas com marketing."

      - id: "crit_solucao_experiencia"
        descricao: "Avalia a consistência da jornada assíncrona proposta e a mitigação técnica dos erros e da lentidão externa."
        requisitos_avaliados:
          - "efetuar_analise_riscos"
          - "elaborar_documentacao_tecnica"
        ancoras:
          0: "Mantém a jornada bloqueante (tela de espera congelada por 12 segundos) sem tratamento de erros."
          1: "Descreve mensagem genérica de erro na tela sem fornecer caminho alternativo ou notificação assíncrona ao usuário."
          2: "Desenha experiência assíncrona fluida (análise em segundo plano com aviso via push/SMS) e mecanismo transparente de retry em caso de indisponibilidade temporária."

      - id: "crit_criterios_gonogo"
        descricao: "Avalia a definição de critérios de aceite mensuráveis e rigor técnico para decisão de liberação em produção."
        requisitos_avaliados:
          - "avaliar_planos_projetos"
          - "elaborar_documentacao_tecnica"
        ancoras:
          0: "Não apresenta critérios de Go/No-Go objetivos ou baseia a decisão em impressões subjetivas."
          1: "Apresenta critérios vagos (ex: 'sistema estável e sem bugs graves') sem métricas de corte quantitativas."
          2: "Estabelece critérios quantitativos e inegociáveis de Go/No-Go (ex: taxa de erro em produção < 1%, tempo de resposta de fallback < 2s e zero vulnerabilidades de segurança críticas)."

