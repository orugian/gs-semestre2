[project]
name = "citizentech-tools"
version = "0.1.0"
description = "Scripts de entrega: md -> html -> pdf (Edge headless) e contagem de paginas (D19)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "markdown>=3.7,<4",
    "pypdf>=5,<7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
