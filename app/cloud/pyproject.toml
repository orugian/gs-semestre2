[project]
name = "citizentech-cloud"
version = "0.1.0"
description = "Lambda de ingestao, SQL do RDS e simulador (FIAP GS 2026.2)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pg8000>=1.31.6",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: testes que exigem banco PostgreSQL de teste",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
